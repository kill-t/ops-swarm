services:
  order-service:
    build:
      context: .
      dockerfile: docker/fault-lab.Dockerfile
    init: true
    ports:
      - "127.0.0.1:18001:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

networks:
  lab:
    driver: bridge
