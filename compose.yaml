x-opsswarm-runtime: &opsswarm-runtime
  image: ops-swarm-runtime:local
  build:
    context: .
    dockerfile: docker/fault-lab.Dockerfile

x-investigation-worker: &investigation-worker
  <<: *opsswarm-runtime
  init: true
  command:
    - python
    - -m
    - opsswarm.worker.main
  restart: unless-stopped
  stop_grace_period: 2m
  environment: &investigation-worker-environment
    OPSSWARM_DATABASE_URL: postgresql+psycopg://opsswarm:local-development-only@control-db:5432/opsswarm
    OPSSWARM_CHECKPOINT_DATABASE_URL: postgresql://opsswarm:local-development-only@control-db:5432/opsswarm_checkpoints
    OPSSWARM_WORKER_POLL_INTERVAL_SECONDS: ${OPSSWARM_WORKER_POLL_INTERVAL_SECONDS:-1}
    OPSSWARM_WORKER_LEASE_DURATION_SECONDS: ${OPSSWARM_WORKER_LEASE_DURATION_SECONDS:-120}
    OPSSWARM_WORKER_PROCESSING_TIMEOUT_SECONDS: ${OPSSWARM_WORKER_PROCESSING_TIMEOUT_SECONDS:-100}
    OPSSWARM_WORKER_BASE_RETRY_DELAY_SECONDS: ${OPSSWARM_WORKER_BASE_RETRY_DELAY_SECONDS:-5}
    OPSSWARM_WORKER_MAX_RETRY_DELAY_SECONDS: ${OPSSWARM_WORKER_MAX_RETRY_DELAY_SECONDS:-300}
    OPSSWARM_OTEL_ENABLED: ${OPSSWARM_OTEL_ENABLED:-false}
    OPSSWARM_OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    OPSSWARM_OTEL_SAMPLE_RATIO: ${OPSSWARM_OTEL_SAMPLE_RATIO:-1}
    OPSSWARM_OTEL_EXPORT_TIMEOUT_SECONDS: ${OPSSWARM_OTEL_EXPORT_TIMEOUT_SECONDS:-2}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
    LLM_THINKING_MODE: ${LLM_THINKING_MODE:-provider_default}
    LLM_STRUCTURED_OUTPUT_METHOD: ${LLM_STRUCTURED_OUTPUT_METHOD:-json_schema}
    EVALUATION_INPUT_COST_PER_MILLION_USD: ${EVALUATION_INPUT_COST_PER_MILLION_USD:-}
    EVALUATION_OUTPUT_COST_PER_MILLION_USD: ${EVALUATION_OUTPUT_COST_PER_MILLION_USD:-}
  depends_on:
    control-migrate:
      condition: service_completed_successfully
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:14318:4318"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - control

  control-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: opsswarm
      POSTGRES_USER: opsswarm
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - control-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-checkpoint-db.sql:/docker-entrypoint-initdb.d/10-create-checkpoint-db.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U opsswarm -d opsswarm
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - control

  control-migrate:
    <<: *opsswarm-runtime
    command:
      - alembic
      - upgrade
      - head
    environment:
      OPSSWARM_DATABASE_URL: postgresql+psycopg://opsswarm:local-development-only@control-db:5432/opsswarm
    depends_on:
      control-db:
        condition: service_healthy
    networks:
      - control

  change-service:
    <<: *opsswarm-runtime
    init: true
    command:
      - uvicorn
      - opsswarm.change_records.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      OPSSWARM_DATABASE_URL: postgresql+psycopg://opsswarm:local-development-only@control-db:5432/opsswarm
      OPSSWARM_DEPLOYMENT_INGESTION_ENABLED: ${OPSSWARM_DEPLOYMENT_INGESTION_ENABLED:-false}
      OPSSWARM_DEPLOYMENT_INGESTION_KEY_ID: ${OPSSWARM_DEPLOYMENT_INGESTION_KEY_ID:-}
      OPSSWARM_DEPLOYMENT_INGESTION_SECRET: ${OPSSWARM_DEPLOYMENT_INGESTION_SECRET:-}
      OPSSWARM_DEPLOYMENT_INGESTION_REPOSITORY: ${OPSSWARM_DEPLOYMENT_INGESTION_REPOSITORY:-}
      OPSSWARM_DEPLOYMENT_INGESTION_IMAGE_REPOSITORY: ${OPSSWARM_DEPLOYMENT_INGESTION_IMAGE_REPOSITORY:-}
      OPSSWARM_DEPLOYMENT_INGESTION_MAX_SIGNATURE_AGE_SECONDS: ${OPSSWARM_DEPLOYMENT_INGESTION_MAX_SIGNATURE_AGE_SECONDS:-300}
      OPSSWARM_DEPLOYMENT_INGESTION_MAX_EVENT_AGE_SECONDS: ${OPSSWARM_DEPLOYMENT_INGESTION_MAX_EVENT_AGE_SECONDS:-86400}
    depends_on:
      control-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18002:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - control

  lab-redis:
    image: redis:7.4.5-alpine
    user: redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    read_only: true
    tmpfs:
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - lab

  redis-proxy:
    <<: *opsswarm-runtime
    init: true
    command:
      - python
      - -m
      - opsswarm.fault_lab.redis_proxy
    environment:
      OPSSWARM_REDIS_PROXY_BACKEND_HOST: lab-redis
    depends_on:
      lab-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:16379:6379"
      - "127.0.0.1:18474:8474"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8474/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - lab

  order-service:
    <<: *opsswarm-runtime
    init: true
    ports:
      - "127.0.0.1:18001:8000"
    environment:
      OPSSWARM_FAULT_LAB_LOG_PATH: /var/log/opsswarm/order-service.jsonl
      OPSSWARM_FAULT_LAB_REDIS_URL: redis://redis-proxy:6379/0
      OPSSWARM_FAULT_LAB_REDIS_PROXY_ADMIN_URL: http://redis-proxy:8474
      OPSSWARM_RUNTIME_METADATA_ENABLED: ${OPSSWARM_RUNTIME_METADATA_ENABLED:-false}
      OPSSWARM_RUNTIME_INSTANCE_ID: ${OPSSWARM_RUNTIME_INSTANCE_ID:-}
      OPSSWARM_RUNTIME_IMAGE_REPOSITORY: ${OPSSWARM_RUNTIME_IMAGE_REPOSITORY:-}
      OPSSWARM_RUNTIME_IMAGE_DIGEST: ${OPSSWARM_RUNTIME_IMAGE_DIGEST:-}
    depends_on:
      redis-proxy:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - order-service-logs:/var/log/opsswarm
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
    depends_on:
      order-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - promtool
        - query
        - instant
        - http://127.0.0.1:9090
        - up
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - lab

  loki:
    image: grafana/loki:3.7.7
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:13100:3100"
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /usr/bin/loki
        - -version
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - lab

  alloy:
    image: grafana/alloy:v1.19.2
    user: "473:473"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy
      order-service:
        condition: service_healthy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - order-service-logs:/var/log/opsswarm:ro
      - alloy-data:/var/lib/alloy/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - lab

  investigation-worker-frozen:
    <<: *investigation-worker
    environment:
      <<: *investigation-worker-environment
      OPSSWARM_WORKER_DATA_SOURCE_MODE: frozen
    networks:
      - control

  investigation-worker-live:
    <<: *investigation-worker
    environment:
      <<: *investigation-worker-environment
      OPSSWARM_WORKER_DATA_SOURCE_MODE: live
      OPSSWARM_INVESTIGATION_PROMETHEUS_BASE_URL: http://prometheus:9090
      OPSSWARM_INVESTIGATION_LOKI_BASE_URL: http://loki:3100
      OPSSWARM_INVESTIGATION_CHANGE_BASE_URL: http://change-service:8000
      OPSSWARM_INVESTIGATION_RUNTIME_BASE_URL: http://order-service:8000
      OPSSWARM_INVESTIGATION_CHANGE_PROVIDER: ${OPSSWARM_INVESTIGATION_CHANGE_PROVIDER:-simulator}
      OPSSWARM_GITHUB_REPOSITORY: ${OPSSWARM_GITHUB_REPOSITORY:-}
      OPSSWARM_GITHUB_TOKEN: ${OPSSWARM_GITHUB_TOKEN:-}
      OPSSWARM_GITHUB_REQUEST_TIMEOUT_SECONDS: ${OPSSWARM_GITHUB_REQUEST_TIMEOUT_SECONDS:-5}
    depends_on:
      control-migrate:
        condition: service_completed_successfully
      change-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - control
      - lab

  verification-worker:
    <<: *opsswarm-runtime
    init: true
    command:
      - python
      - -m
      - opsswarm.verification.main
    restart: unless-stopped
    environment:
      OPSSWARM_DATABASE_URL: postgresql+psycopg://opsswarm:local-development-only@control-db:5432/opsswarm
      OPSSWARM_VERIFIER_PROMETHEUS_BASE_URL: http://prometheus:9090
      OPSSWARM_VERIFICATION_WORKER_POLL_INTERVAL_SECONDS: ${OPSSWARM_VERIFICATION_WORKER_POLL_INTERVAL_SECONDS:-1}
      OPSSWARM_VERIFICATION_WORKER_LEASE_DURATION_SECONDS: ${OPSSWARM_VERIFICATION_WORKER_LEASE_DURATION_SECONDS:-15}
      OPSSWARM_VERIFICATION_WORKER_BASE_RETRY_DELAY_SECONDS: ${OPSSWARM_VERIFICATION_WORKER_BASE_RETRY_DELAY_SECONDS:-2}
      OPSSWARM_VERIFICATION_WORKER_MAX_RETRY_DELAY_SECONDS: ${OPSSWARM_VERIFICATION_WORKER_MAX_RETRY_DELAY_SECONDS:-60}
    depends_on:
      control-migrate:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - control
      - lab

networks:
  control:
    driver: bridge
  lab:
    driver: bridge

volumes:
  alloy-data:
  control-db-data:
  loki-data:
  order-service-logs:
  prometheus-data:
