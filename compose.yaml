x-opsswarm-runtime: &opsswarm-runtime
  image: ops-swarm-runtime:local

services:
  control-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: opsswarm
      POSTGRES_USER: opsswarm
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - control-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-checkpoint-db.sql:/docker-entrypoint-initdb.d/10-create-checkpoint-db.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U opsswarm -d opsswarm
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - control

  control-migrate:
    <<: *opsswarm-runtime
    build:
      context: .
      dockerfile: docker/fault-lab.Dockerfile
    command:
      - alembic
      - upgrade
      - head
    environment:
      OPSSWARM_DATABASE_URL: postgresql+psycopg://opsswarm:local-development-only@control-db:5432/opsswarm
    depends_on:
      control-db:
        condition: service_healthy
    networks:
      - control

  lab-redis:
    image: redis:7.4.5-alpine
    user: redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    read_only: true
    tmpfs:
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - lab

  redis-proxy:
    <<: *opsswarm-runtime
    init: true
    command:
      - python
      - -m
      - opsswarm.fault_lab.redis_proxy
    environment:
      OPSSWARM_REDIS_PROXY_BACKEND_HOST: lab-redis
    depends_on:
      lab-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:16379:6379"
      - "127.0.0.1:18474:8474"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8474/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - lab

  order-service:
    <<: *opsswarm-runtime
    init: true
    ports:
      - "127.0.0.1:18001:8000"
    environment:
      OPSSWARM_FAULT_LAB_REDIS_URL: redis://redis-proxy:6379/0
      OPSSWARM_FAULT_LAB_REDIS_PROXY_ADMIN_URL: http://redis-proxy:8474
    depends_on:
      redis-proxy:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  verification-worker:
    <<: *opsswarm-runtime
    init: true
    command:
      - python
      - -m
      - opsswarm.verification.main
    restart: unless-stopped
    environment:
      OPSSWARM_DATABASE_URL: postgresql+psycopg://opsswarm:local-development-only@control-db:5432/opsswarm
      OPSSWARM_VERIFIER_FAULT_LAB_BASE_URL: http://order-service:8000
      OPSSWARM_VERIFICATION_WORKER_POLL_INTERVAL_SECONDS: ${OPSSWARM_VERIFICATION_WORKER_POLL_INTERVAL_SECONDS:-1}
      OPSSWARM_VERIFICATION_WORKER_LEASE_DURATION_SECONDS: ${OPSSWARM_VERIFICATION_WORKER_LEASE_DURATION_SECONDS:-15}
      OPSSWARM_VERIFICATION_WORKER_BASE_RETRY_DELAY_SECONDS: ${OPSSWARM_VERIFICATION_WORKER_BASE_RETRY_DELAY_SECONDS:-2}
      OPSSWARM_VERIFICATION_WORKER_MAX_RETRY_DELAY_SECONDS: ${OPSSWARM_VERIFICATION_WORKER_MAX_RETRY_DELAY_SECONDS:-60}
    depends_on:
      control-migrate:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - control
      - lab

networks:
  control:
    driver: bridge
  lab:
    driver: bridge

volumes:
  control-db-data:
