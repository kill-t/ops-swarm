services:
  control-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: opsswarm
      POSTGRES_USER: opsswarm
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - control-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U opsswarm -d opsswarm
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - control

  order-service:
    build:
      context: .
      dockerfile: docker/fault-lab.Dockerfile
    init: true
    ports:
      - "127.0.0.1:18001:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

networks:
  control:
    driver: bridge
  lab:
    driver: bridge

volumes:
  control-db-data:
