[project]
name = "ops-swarm"
version = "0.1.0"
description = "面向线上事故响应的可恢复多 Agent 协作与安全执行平台"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "httpx2>=2.10,<3",
    "langchain>=1.1,<2",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.1,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.22,<1",
    "redis>=5.2,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.9,<1",
    "testcontainers[postgres]>=4.10,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsswarm"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: 需要真实外部依赖的集成测试",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
